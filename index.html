    .languages { align-self: flex-end; display: flex; gap: 6px; margin-bottom: 12px; }
    .languages button { min-width: 44px; min-height: 44px; color: #fff0da; background: #290708; border: 1px solid #ad814f; border-radius: 5px; cursor: pointer; }
    .languages button[aria-pressed="true"] { background: #edc788; color: #350607; }
    header, main { width: 100%; }
    h1 { margin: 0; }
    img { display: block; max-width: 100%; height: auto; margin-inline: auto; }
    h1 img { width: min(100%, 510px); }
    .birthday, .date { color: #f4d29a; font-family: Georgia, serif; text-transform: uppercase; }
    .birthday { margin: 18px 0 0; font-size: clamp(14px, 2.2vw, 20px); letter-spacing: .27em; }
    .divider { display: flex; align-items: center; gap: 14px; width: min(65%, 280px); margin: 27px auto 19px; color: #efc984; }
    .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: #c7934e; }
    .theme { width: min(82%, 305px); }
    .date { margin: 13px 0 0; font-size: 12px; letter-spacing: .15em; line-height: 1.7; }
    main { max-width: 500px; margin-top: clamp(32px, 6vw, 60px); }
    .panel {
      padding: clamp(19px, 4vw, 31px); background: #290708ef;
      border: 1px solid #bd8a50a6; border-radius: 8px;
    }
    h2 { color: #f4d29a; font-weight: 600; font-size: clamp(21px, 4vw, 26px); margin: 0 0 10px; }
    .intro { font-size: 15px; line-height: 1.6; margin: 0 0 22px; }
    ul { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .action {
      min-height: 46px; display: grid; place-items: center; padding: 7px 12px;
      border: 1px solid #ab7d49; border-radius: 5px; background: #480c11;
      color: #fff0da; text-decoration: none; font-weight: 650; font-size: 14px;
    }
    a.action:hover { background: #682224; }

      for (const button of buttons) {
        button.setAttribute("aria-pressed", String(button.dataset.lang === language));
      }
      list.replaceChildren();
      for (const [index, action] of actions.entries()) {
        const item = document.createElement("li");
        const ready = action.url.startsWith("https://");
        const element = document.createElement(ready ? "a" : "span");
        element.className = "action";
        element.textContent = english ? englishLabels[index] : action.label;

        if (ready) {
          element.href = action.url;
          if (action.primary) element.classList.add("primary");
        } else {
          element.classList.add("pending");
          const status = document.createElement("small");
          status.textContent = english ? "Coming soon" : action.pending;
          element.append(status);
        }

        item.append(element);
        list.append(item);
      }
    }

    let preferred = /^pt(?:-|$)/i.test(navigator.language) ? "pt" : "en";
    try {
      const saved = localStorage.getItem("sparkle-language");
      if (saved === "pt" || saved === "en") preferred = saved;
    } catch {}
    applyLanguage(preferred);

    for (const button of buttons) {
      button.addEventListener("click", () => {
        applyLanguage(button.dataset.lang);
        try { localStorage.setItem("sparkle-language", button.dataset.lang); } catch {}
      });
    }
  </script>
</body>
</html>
